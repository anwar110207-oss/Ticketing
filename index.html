
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyBook Airlines</title>
<style>
body{margin:0;font-family:Arial;background:#eef2f7}nav{background:#003366;color:#fff;padding:15px;display:flex;justify-content:space-between}
nav a{color:#fff;text-decoration:none;margin:0 10px}.hero{padding:80px;text-align:center;background:linear-gradient(#00336688,#00336688),url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1600&q=80') center/cover;color:#fff}
section{padding:30px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;background:#fff;padding:20px;border-radius:10px}input,select,button{padding:10px}button{background:#003366;color:#fff;border:0}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ccc;padding:8px}th{background:#003366;color:#fff}footer{background:#003366;color:#fff;text-align:center;padding:20px}
</style></head><body>
<nav><b>✈ SkyBook</b><div><a href="#">Home</a><a href="#">Flights</a><a href="#">Contact</a></div></nav>
<div class="hero"><h1>Book Your Dream Flight</h1><p>Fast • Easy • Secure</p></div>
<section><h2>Book Flight</h2><form><input placeholder="Full Name"><input placeholder="Email"><input placeholder="From"><input placeholder="Destination"><input type="date"><select><option>Economy</option><option>Business</option></select><button>Book Now</button></form></section>
<section><h2>Available Flights</h2><table><tr><th>Flight</th><th>From</th><th>To</th><th>Price</th></tr><tr><td>SB101</td><td>Nairobi</td><td>Dubai</td><td>$320</td></tr><tr><td>SB205</td><td>Nairobi</td><td>London</td><td>$650</td></tr></table></section>
<footer>©2026 SkyBook Airlines</footer>
